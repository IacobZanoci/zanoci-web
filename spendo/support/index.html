<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

        <title>Spendo – Support</title>
        <link rel="icon" type="image/x-icon" href="/images/tabIcon.png">

        <style>
            * {
                font-family: 'Inter', sans-serif;
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html, body {
                overflow-x: hidden;
                background-color: #0F0F0F;
            }

            a {
                color: #306FDB;
                text-decoration: none;
            }

            a:hover {
                text-decoration: underline;
            }

            .container {
                max-width: 780px;
                margin-left: auto;
                margin-right: auto;
                padding: 0 1.5rem;
            }

            /* PAGE HEADER */
            .page-header {
                padding-top: 5rem;
                padding-bottom: 3rem;
                border-bottom: 1px solid rgba(255, 255, 255, 0.10);
            }

            .app-label {
                color: #306FDB;
                font-size: 0.875rem;
                font-weight: 500;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                margin-bottom: 1rem;
            }

            .page-title {
                color: #FFFFFF;
                font-size: 2.25rem;
                font-weight: 700;
                line-height: 1.2;
            }

            /* CONTENT */
            .support-content {
                padding-top: 3rem;
                padding-bottom: 6rem;
            }

            .support-text {
                color: rgba(255, 255, 255, 0.75);
                font-size: 1rem;
                font-weight: 400;
                line-height: 1.8;
                margin-bottom: 1.25rem;
            }

            .support-email {
                color: #306FDB;
                font-size: 1rem;
                font-weight: 500;
            }

            /* FOOTER */
            .page-footer {
                border-top: 1px solid rgba(255, 255, 255, 0.10);
                padding: 2rem 0 3rem;
                text-align: center;
            }

            .footer-text {
                color: rgba(255, 255, 255, 0.30);
                font-size: 0.8rem;
                font-weight: 400;
                line-height: 1.6;
            }

            /* RESPONSIVE */
            @media (max-width: 640px) {
                .page-header {
                    padding-top: 3.5rem;
                    padding-bottom: 2rem;
                }

                .page-title {
                    font-size: 1.75rem;
                }
            }
        </style>
    </head>
    <body>

        <div class="container">

            <div class="page-header">
                <p class="app-label">Spendo</p>
                <h1 class="page-title">Support</h1>
            </div>

            <div class="support-content">
                <p class="support-text">Questions, bug reports, or feature requests?<br>Email me — I read every message.</p>
                <a class="support-email" href="mailto:iacobzanoci.dev@gmail.com">iacobzanoci.dev@gmail.com</a>
            </div>

        </div>

        <div class="page-footer">
            <div class="container">
                <p class="footer-text">© 2026 Zanoci Iacob. All rights reserved.</p>
            </div>
        </div>

    </body>
</html>
